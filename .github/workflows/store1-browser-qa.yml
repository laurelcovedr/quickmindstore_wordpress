name: Store1 browser QA
on:
  pull_request:
    paths: ['quickmindstore1/**', '.github/workflows/store1-browser-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: quickmindstore1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store1-browser-qa
          path: quickmindstore1/browser-qa-artifacts
          retention-days: 14
